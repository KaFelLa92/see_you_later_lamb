# .properties 파일은 프로젝트 설정 파일로, apprentice.properties 는 별도로 관리 가능

# [1] 서버 포트 설정
server.port=8080

# [2] JDBC 데이터베이스 연결 설정 , DAO 계층에서 사용될 정보
# 1. 연결할 db의 주소
spring.datasource.url=jdbc:mysql://localhost:3306/seeyoulaterlamb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# 2. 연결할 db의 사용자 이름
spring.datasource.username=root
# 3. 연결할 db의 비밀번호 , 실제 운영 시에는 깃헙에 올리지 않도록 주의
spring.datasource.password=1234

# [3] 로깅 설정
# 로그 레벨 기본값은 info. 필요에 따라 debug 로 변경 가능
# logging.level.root=info

# 1. 로그 레벨 단계
# 순서 : debug < info < warn < error
# info 로 설정하면 info/warn/error 로그 출력
# warn 으로 설정하면 warn/error 로그만 출력
# logging.level=info

# 2. 로그 파일 저장 위치 (gitignore에 반드시 추가해야 함)
# logging.file.name=logs/app.log

# 3. 로그 파일 용량/개수 제한
logging.logback.rollingpolicy.max-file-size=1MB
# 3-2 : 로그 파일 최대 10개까지 보관
logging.logback.rollingpolicy.max-history=10

# 4. 스프링 부트 시작 시 불필요한 로그를 줄이는 설정 (필요 시 주석 해제)
# spring.main.log-startup-info=false
# logging.level.org.springframework.boot.web=warn
# logging.level.org.springframework.boot.web.embedded.tomcat=warn
# logging.level.org.apache.catalina=warn
# logging.level.org.apache.coyote=warn
# logging.level.org.springframework.web=warn

# 5. SQL 로깅 (개발 중에만 true로 설정)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 6. 로그 출력 포맷
# %msg : 로그 메시지 , %n : 줄바꿈 , %d{yyyy-MM-dd HH:mm:ss} : 날짜/시간
# %level : 로그 레벨 , %logger : 로그 발생 위치
# logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %msg %n
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %level %logger %msg %n

# 7. 애플리케이션 로깅 레벨
logging.level.web.service=INFO
logging.level.web.controller=INFO
logging.level.web.exception=ERROR


# [4] 파일 업로드 최대 크기 설정
# 1. 파일 업로드 기본 경로 (절대 경로)
# Windows 예시: C:/uploads
# Linux 예시: /app/uploads
file.upload.base-path=/app/uploads

# 2. 최대 파일 크기 (바이트)
# 10MB = 10485760 bytes
file.upload.max-size=10485760

# [5] Spring 파일 업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# [6] JPA 개발단계 설정
# JPA + MyBatis에서는 create 로 써야 함
spring.jpa.hibernate.ddl-auto=create
# 데이터소스 초기화 지연 (JPA 테이블 생성 후에 data.sql 실행)
spring.jpa.defer-datasource-initialization=true
# JPA에서 카멜 표기법 쓰기
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# SQL 콘솔 출력
spring.jpa.show-sql=true
# SQL 포맷팅
spring.jpa.properties.hibernate.format_sql=true
# SQL 파라미터 출력 (로그)
logging.level.org.hibernate.type.descriptor.sql=trace

# [7] SQL schema와 data Spring 실행 시 자동 연결
# 1. Spring 실행 시 SQL 파일 자동 실행
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# spring.sql.init.schema-locations=classpath:/sql/schema.sql
spring.sql.init.data-locations=classpath:/sql/data.sql

# [8] JWT 설정
# 1. JWT 비밀키 (최소 256bit 이상, 실제 운영에서는 환경변수로 관리)
jwt.secret=fh38$U8dhf92Hfs!03hdH@(3jfs9#H2fs9HfsS0dfjkls82hf

# 2. Access Token 유효시간 (밀리초)
# 1시간 = 3600000ms
jwt.access-token-validity=3600000

# 3. Refresh Token 유효시간 (밀리초)
# 7일 = 604800000ms
jwt.refresh-token-validity=604800000

# [9] 카카오 API 설정
# 카카오 REST API 키 (https://developers.kakao.com에서 발급)
kakao.api.key=1f54735975efc268bb021af3f1c41758

# ============================================
# [9] OAuth 2.0 소셜 로그인 설정
# ============================================

# ----------------
# 구글 OAuth 설정
# ----------------
# 발급 위치: https://console.cloud.google.com/apis/credentials
# 1. 프로젝트 생성
# 2. OAuth 2.0 클라이언트 ID 생성
# 3. 승인된 리디렉션 URI 추가: http://localhost:8080/api/auth/oauth2/callback/google

# 구글 클라이언트 ID
oauth2.google.client-id=YOUR_GOOGLE_CLIENT_ID

# 구글 클라이언트 시크릿
oauth2.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET

# 구글 리디렉션 URI (인증 성공 후 돌아올 주소)
oauth2.google.redirect-uri=http://localhost:8080/api/auth/oauth2/callback/google

# 구글 인증 URL (변경 불필요)
oauth2.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth

# 구글 토큰 교환 URL (변경 불필요)
oauth2.google.token-uri=https://oauth2.googleapis.com/token

# 구글 사용자 정보 URL (변경 불필요)
oauth2.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# 구글 요청 스코프 (가져올 사용자 정보 범위)
oauth2.google.scope=openid,profile,email

# ----------------
# 카카오 OAuth 설정
# ----------------
# 발급 위치: https://developers.kakao.com
# 1. 애플리케이션 추가
# 2. 앱 키 → REST API 키 복사
# 3. 플랫폼 설정 → Web 플랫폼 등록
# 4. Redirect URI 등록: http://localhost:8080/api/auth/oauth2/callback/kakao

# 카카오 클라이언트 ID (REST API 키)
oauth2.kakao.client-id=YOUR_KAKAO_REST_API_KEY

# 카카오 클라이언트 시크릿 (선택사항, 보안 강화 시 사용)
# 앱 설정 → 보안 → Client Secret 활성화 후 발급
oauth2.kakao.client-secret=

# 카카오 리디렉션 URI
oauth2.kakao.redirect-uri=http://localhost:8080/api/auth/oauth2/callback/kakao

# 카카오 인증 URL (변경 불필요)
oauth2.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize

# 카카오 토큰 교환 URL (변경 불필요)
oauth2.kakao.token-uri=https://kauth.kakao.com/oauth/token

# 카카오 사용자 정보 URL (변경 불필요)
oauth2.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# 카카오 요청 스코프 (변경 불필요)
oauth2.kakao.scope=profile_nickname,account_email

# ----------------
# 네이버 OAuth 설정
# ----------------
# 발급 위치: https://developers.naver.com/apps
# 1. 애플리케이션 등록
# 2. 서비스 URL: http://localhost:8080
# 3. Callback URL: http://localhost:8080/api/auth/oauth2/callback/naver
# 4. 제공 정보 선택: 이메일, 닉네임, 프로필 사진

# 네이버 클라이언트 ID
oauth2.naver.client-id=YOUR_NAVER_CLIENT_ID

# 네이버 클라이언트 시크릿
oauth2.naver.client-secret=YOUR_NAVER_CLIENT_SECRET

# 네이버 리디렉션 URI
oauth2.naver.redirect-uri=http://localhost:8080/api/auth/oauth2/callback/naver

# 네이버 인증 URL (변경 불필요)
oauth2.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize

# 네이버 토큰 교환 URL (변경 불필요)
oauth2.naver.token-uri=https://nid.naver.com/oauth2.0/token

# 네이버 사용자 정보 URL (변경 불필요)
oauth2.naver.user-info-uri=https://openapi.naver.com/v1/nid/me

# 네이버 요청 스코프 (변경 불필요)
oauth2.naver.scope=name,email

# [10] 페이징 기본 설정
# 1. 한 페이지당 기본 항목 수
spring.data.web.pageable.default-page-size=10
# 2. 한 페이지당 최대 항목 수
spring.data.web.pageable.max-page-size=100
