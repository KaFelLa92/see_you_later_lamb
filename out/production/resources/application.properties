# .properties 파일은 프로젝트 설정 파일로, apprentice.properties 는 별도로 관리 가능

# [1] 서버 포트 설정
server.port=8080

# [2] JDBC 데이터베이스 연결 설정 , DAO 계층에서 사용될 정보
# 1. 연결할 db의 주소
spring.datasource.url=jdbc:mysql://localhost:3306/seeyoulaterlamb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# 2. 연결할 db의 사용자 이름
spring.datasource.username=root
# 3. 연결할 db의 비밀번호 , 실제 운영 시에는 깃헙에 올리지 않도록 주의
spring.datasource.password=1234

# [3] 로깅 설정
# 로그 레벨 기본값은 info. 필요에 따라 debug 로 변경 가능
# logging.level.root=info

# 1. 로그 레벨 단계
# 순서 : debug < info < warn < error
# info 로 설정하면 info/warn/error 로그 출력
# warn 으로 설정하면 warn/error 로그만 출력
# logging.level=info

# 2. 로그 파일 저장 위치 (gitignore에 반드시 추가해야 함)
# logging.file.name=logs/app.log

# 3. 로그 파일 용량/개수 제한
logging.logback.rollingpolicy.max-file-size=1MB
# 3-2 : 로그 파일 최대 10개까지 보관
logging.logback.rollingpolicy.max-history=10

# 4. 스프링 부트 시작 시 불필요한 로그를 줄이는 설정 (필요 시 주석 해제)
# spring.main.log-startup-info=false
# logging.level.org.springframework.boot.web=warn
# logging.level.org.springframework.boot.web.embedded.tomcat=warn
# logging.level.org.apache.catalina=warn
# logging.level.org.apache.coyote=warn
# logging.level.org.springframework.web=warn
# SQL 로깅 (개발 중에만 true로 설정)

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 5. 로그 출력 포맷
# %msg : 로그 메시지 , %n : 줄바꿈 , %d{yyyy-MM-dd HH:mm:ss} : 날짜/시간
# %level : 로그 레벨 , %logger : 로그 발생 위치
# logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %msg %n
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %level %logger %msg %n

# ========================================
# 로깅 설정
# ========================================
logging.level.web.service=INFO
logging.level.web.controller=INFO
logging.level.web.exception=ERROR


# 6. 파일 업로드 최대 크기 설정
# ========================================
# 파일 업로드 설정
# ========================================

# 파일 업로드 기본 경로 (절대 경로)
# Windows 예시: C:/uploads
# Linux 예시: /app/uploads
file.upload.base-path=/app/uploads

# 최대 파일 크기 (바이트)
# 10MB = 10485760 bytes
file.upload.max-size=10485760

# Spring 파일 업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# 7. JPA 개발단계 설정 (8번보다 앞에 있어야 함)
# JPA + MyBatis에서는 create 로 써야 함
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
# JPA에서 카멜 표기법 쓰기
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# SQL 콘솔 출력
spring.jpa.show-sql=true
# SQL 포맷팅
spring.jpa.properties.hibernate.format_sql=true
# SQL 파라미터 출력 (로그)
logging.level.org.hibernate.type.descriptor.sql=trace

# 8. SQL schema와 data Spring 실행 시 자동 연결
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# spring.sql.init.schema-locations=classpath:/sql/schema.sql
spring.sql.init.data-locations=classpath:/sql/data.sql

# ============================================
# JWT 설정
# ============================================
# JWT 비밀키 (최소 256bit 이상, 실제 운영에서는 환경변수로 관리)
jwt.secret=fh38$U8dhf92Hfs!03hdH@(3jfs9#H2fs9HfsS0dfjkls82hf

# Access Token 유효시간 (밀리초)
# 1시간 = 3600000ms
jwt.access-token-validity=3600000

# Refresh Token 유효시간 (밀리초)
# 7일 = 604800000ms
jwt.refresh-token-validity=604800000

